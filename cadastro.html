<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro | Pizzaria e Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="cadastro">
  <header class="topo">
    <a class="logo" href="../index.html">Pizzaria e Eventos</a>
  </header>
  <div class="toalha" aria-hidden="true"></div>

  <main class="caixa">
    <h1>Criar conta</h1>
    <form id="form-cadastro">
      <label for="nome">Nome completo</label>
      <input id="nome" name="nome" type="text" required autocomplete="name">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="telefone">Telefone com DDD</label>
      <input id="telefone" name="telefone" type="tel" required autocomplete="tel">
      <label for="senha">Senha (mínimo 6 caracteres)</label>
      <input id="senha" name="senha" type="password" required autocomplete="new-password">
      <label for="senha2">Repita a senha</label>
      <input id="senha2" name="senha2" type="password" required autocomplete="new-password">
      <p id="erro" class="erro" role="alert"></p>
      <button class="btn" type="submit">Criar conta</button>
    </form>
    <p>Já tem conta? <a href="login.html">Entrar</a></p>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
