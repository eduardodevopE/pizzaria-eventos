name: Backup automático

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # backup diário às 03:00 UTC (00:00 em Brasília)

permissions:
  contents: write

jobs:
  backup:
    name: Criar ponto de restauração
    runs-on: ubuntu-latest
    steps:
      - name: Baixar histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar tag de backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          DATA=$(date +'%Y%m%d-%H%M%S')
          git tag "backup-$DATA"
          git push origin "backup-$DATA"
