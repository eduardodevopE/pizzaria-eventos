<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Pizzaria e Eventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-pagina="login">
  <header class="topo">
    <a class="logo" href="../index.html">Pizzaria e Eventos</a>
  </header>
  <div class="toalha" aria-hidden="true"></div>

  <main class="caixa">
    <h1>Entrar</h1>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" required autocomplete="current-password">
      <p id="erro" class="erro" role="alert"></p>
      <button class="btn" type="submit">Entrar</button>
    </form>
    <p>Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
